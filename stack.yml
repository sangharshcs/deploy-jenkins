services:
  controller:
    image: ${CONTROLLER_IMAGE:?CONTROLLER_IMAGE must be set — run via deploy.sh or export it first}
    ports:
      - "${UI_PORT:-8080}:8080"
    volumes:
      - "${CONTROLLER_ROOT:-/opt/jenkins_home}:/var/jenkins_home"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    secrets:
      - jenkins-user
      - jenkins-pass
      - agent-user
      - agent-pass
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        # Does not pin the controller to one node on a multi-node cluster (see README).
        constraints: ["node.role == manager"]

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be set — run via deploy.sh or export it first}
    environment:
      - JENKINS_CONTROLLER_URL=${JENKINS_CONTROLLER_URL:?JENKINS_CONTROLLER_URL must be set — run via deploy.sh or export it first}
      - WORKER_ROOT=${WORKER_ROOT:-/opt/worker_home}
      - SWARM_EXECUTORS=${SWARM_EXECUTORS:-5}
      - SWARM_LABELS=${SWARM_LABELS:-swarm docker}
      - SWARM_WEBSOCKET=${SWARM_WEBSOCKET:-true}
    # Workspaces live in the container filesystem and are lost when a replica is replaced.
    # Optional and untested here: for Docker builds, mount the socket and run as root.
    # This gives build jobs control of the host Docker daemon (see README, Security).
    # volumes:
    #   - "/var/run/docker.sock:/var/run/docker.sock"
    # user: root
    secrets:
      - agent-user
      - agent-pass
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      # 10 retries x 10s is about 100s; a slower controller start can exhaust it (see README).
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10

secrets:
  jenkins-user:
    external: true
  jenkins-pass:
    external: true
  agent-user:
    external: true
  agent-pass:
    external: true
