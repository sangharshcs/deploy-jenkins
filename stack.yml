services:
  controller:
    image: ${CONTROLLER_IMAGE:?CONTROLLER_IMAGE must be set — run via deploy.sh or export it first}
    ports:
      - "${UI_PORT:-8080}:8080"
    volumes:
      - "${CONTROLLER_ROOT:-/opt/jenkins_home}:/var/jenkins_home"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/jenkins/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    secrets:
      - jenkins-user
      - jenkins-pass
      - agent-user
      - agent-pass
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        # On a single-node Swarm this constraint is always satisfied.
        # On multi-node it restricts scheduling to any manager node, not one
        # specific host.  Use a node label (node.labels.jenkins==controller)
        # to pin to one machine when using a local bind mount.
        # With shared storage (NFS/EFS) this constraint is unnecessary.
        constraints: ["node.role == manager"]

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be set — run via deploy.sh or export it first}
    environment:
      - JENKINS_CONTROLLER_URL=${JENKINS_CONTROLLER_URL:?JENKINS_CONTROLLER_URL must be set — run via deploy.sh or export it first}
      - WORKER_ROOT=${WORKER_ROOT:-/opt/worker_home}
      - SWARM_EXECUTORS=${SWARM_EXECUTORS:-5}
      - SWARM_LABELS=${SWARM_LABELS:-swarm docker}
      - SWARM_WEBSOCKET=${SWARM_WEBSOCKET:-true}
    # Each replica keeps its workspace in its own container filesystem.
    # Files are discarded when the replica is removed or replaced.
    # For trusted Docker builds only, opt in to host Docker access by adding
    # both settings below (they go together — socket access is root-equivalent
    # on the host regardless of the container user, so there is no security
    # benefit to keeping the container non-root once the socket is mounted):
    # volumes:
    #   - "/var/run/docker.sock:/var/run/docker.sock"
    # user: root
    # WARNING: with this mount, any build job can control the host Docker
    # daemon, read host paths, and reach the controller's secrets. The agent
    # Jenkins account does not restrict that access.
    secrets:
      # Workers receive only the dedicated agent account — never the admin secret.
      - agent-user
      - agent-pass
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      # Retry window (~100s) must exceed controller start_period (60s) + one healthcheck interval (30s).
      # Increase max_attempts if the controller is slow to pass its healthcheck.
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10

secrets:
  jenkins-user:
    external: true
  jenkins-pass:
    external: true
  agent-user:
    external: true
  agent-pass:
    external: true
